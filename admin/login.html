<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Tiranga Pay</title>
    <link rel="stylesheet" href="assets/admin.css">
    <script>
        (function() {
            var theme = localStorage.getItem('tp_admin_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <style>
    body {
        display: flex; align-items: center; justify-content: center; padding: 20px;
        background: var(--bg);
    }
    body::after {
        content: ""; position: fixed; inset: 0;
        background:
            radial-gradient(700px 350px at 20% 0%, rgba(255,122,0,0.12), transparent 60%),
            radial-gradient(700px 350px at 90% 100%, rgba(255,122,0,0.08), transparent 60%);
        pointer-events: none; z-index: 0;
    }
    .login-wrap { width: 100%; max-width: 420px; position: relative; z-index: 1; }
    .login-card {
        background: var(--card); border: 1px solid var(--border); border-radius: 22px;
        padding: 34px 30px; box-shadow: var(--shadow-lg);
    }
    .login-logo { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
    .login-logo .box {
        width: 54px; height: 54px; border-radius: 16px; background: var(--primary-grad);
        color: #fff; display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 24px; box-shadow: 0 10px 22px -6px rgba(255,122,0,.55);
    }
    .login-logo h1 { font-size: 21px; font-weight: 800; letter-spacing: -.4px; }
    .login-logo p { font-size: 12px; color: var(--muted); font-weight: 600; }
    .login-card .l-sub { font-size: 13px; color: var(--muted); margin-bottom: 22px; font-weight: 600; }
    .login-hint {
        display: none; padding: 12px 14px; border-radius: 11px; font-size: 12.5px; font-weight: 700;
        background: var(--primary-soft); color: var(--primary); border: 1px dashed var(--primary);
        line-height: 1.55; margin-bottom: 16px;
    }
    .login-err { display: none; padding: 12px 14px; border-radius: 11px; font-size: 12.5px; font-weight: 700; background: var(--danger-soft); color: var(--danger); margin-bottom: 16px; }
    .field input { height: 46px; font-size: 14px; font-weight: 600; }
    .login-foot { text-align: center; margin-top: 18px; }
    .login-foot a { font-size: 12.5px; color: var(--muted); font-weight: 700; }
    .login-foot a:hover { color: var(--primary); }
    .setup-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--warning-soft); color: var(--warning); border: 1px solid rgba(251,191,36,.35); border-radius: 99px; padding: 5px 12px; font-size: 10.5px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 14px; }
    </style>
</head>
<body>

<div class="login-wrap">
    <div class="login-card">
        <div class="login-logo">
            <div class="box">TP</div>
            <div>
                <h1>Tiranga Pay</h1>
                <p>Control Operations Panel</p>
            </div>
        </div>

        <div class="setup-chip" id="setupChip">Setup Mode — First Admin</div>
        <div class="login-hint" id="setupModeBanner">
            No admin account exists yet. The first username + password entered here will create the admin account.
        </div>
        <div class="login-err" id="loginError"></div>

        <form id="adminLoginForm" onsubmit="return handleAdminLogin(event)">
            <div class="field">
                <label>Username</label>
                <input type="text" id="adminUsername" placeholder="admin" autocomplete="username">
            </div>
            <div class="field" style="margin-bottom: 22px;">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" id="adminLoginBtn" style="width: 100%; height: 46px; font-size: 14.5px;">Login to Admin Panel</button>
        </form>

        <div class="login-foot">
            <a href="../user-app/login.html">&lsaquo; Back to User App</a>
        </div>
    </div>
</div>

<script>
function showAdminError(msg) {
    const el = document.getElementById('loginError');
    el.textContent = msg;
    el.style.display = 'block';
}

document.addEventListener('DOMContentLoaded', async () => {
    if (!tpAdminDB) return;
    try {
        const snap = await tpAdminRef('admins').once('value');
        if (!snap.exists()) {
            document.getElementById('setupModeBanner').style.display = 'block';
        } else {
            document.getElementById('setupChip').style.display = 'none';
        }
    } catch (e) {}
});

async function handleAdminLogin(e) {
    e.preventDefault();
    const username = document.getElementById('adminUsername').value.trim();
    const password = document.getElementById('adminPassword').value;
    const btn = document.getElementById('adminLoginBtn');

    if (!username || !password) { showAdminError('Please enter username and password.'); return; }
    if (!tpAdminDB) { showAdminError('Firebase not connected. Check admin firebase-config.js'); return; }

    btn.disabled = true;
    btn.textContent = 'VERIFYING...';

    try {
        const sanitized = username.replace(/[.\/#$[\]]/g, '_');
        const hash = await tpAdminHashPassword(password);
        const token = tpAdminId();

        const adminsSnap = await tpAdminRef('admins').once('value');

        if (!adminsSnap.exists()) {
            await tpAdminRef('admins/' + sanitized).set({
                name: username,
                password: hash,
                created_at: tpAdminNow()
            });
        } else {
            const admin = adminsSnap.child(sanitized).val();
            if (!admin || !admin.password || admin.password !== hash) {
                showAdminError('Invalid username or password.');
                return;
            }
        }

        await tpAdminRef('admin_sessions/' + token).set({ username: sanitized, created_at: tpAdminNow() });
        localStorage.setItem('tp_admin_user', sanitized);
        localStorage.setItem('tp_admin_token', token);
        window.location.href = 'index.html';
    } catch (err) {
        showAdminError('Login failed. Check Firebase rules/permissions.');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Login to Admin Panel';
    }
}
</script>

</body>
</html>
